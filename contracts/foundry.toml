[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.37"
via_ir = true

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
